<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黄河大合唱创作游戏原型</title>
  <meta name="description" content="Galgame 叙事与 2D 横版探索结合的完整流程原型。">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #87cbee; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #start-screen { position: fixed; inset: 0; z-index: 10; background: #b62323 url('assets/cover.jpg') center / cover no-repeat; }
    #start-button { position: absolute; left: 74%; top: 68%; transform: translate(-50%, -50%); min-width: 210px; padding: 14px 30px; border: 2px solid #75231d; background: rgba(247,236,209,.82); color: #75231d; font: inherit; font-size: clamp(1.2rem, 2vw, 1.7rem); letter-spacing: .05em; cursor: pointer; }
    #start-button:hover { background: #75231d; color: #fff; }
    #start-button:focus-visible, #exit-button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #exit-button { position: fixed; left: 22px; top: 18px; z-index: 9; padding: 4px 8px; border: 0; background: transparent; color: #fff; font: inherit; font-size: 1rem; letter-spacing: .08em; text-shadow: 0 2px 5px rgba(0,0,0,.9); cursor: pointer; }
    #galgame { position: fixed; inset: 0; overflow: hidden; background: #626a73 url('assets/yanan-cave-bg.png') center / cover no-repeat; z-index: 2; color: #fff; }
    #galgame::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,.62) 0%, rgba(0,0,0,.2) 24%, rgba(0,0,0,.06) 50%, rgba(0,0,0,.24) 70%, rgba(0,0,0,.9) 100%); }
    .portrait { position: absolute; bottom: 170px; width: 180px; height: 310px; background: #c9544d; z-index: 0; transition: filter .25s ease; }
    .portrait.portrait-dimmed { filter: brightness(.32) saturate(.62); }
    #portrait-left { left: calc(2vw - 20px); bottom: -45vh; width: 58.56vh; height: 130vh; background: transparent url('assets/xinghai-portrait-calm.png') center bottom / contain no-repeat; z-index: 0; pointer-events: none; }
    #portrait-right { right: calc(7vw - 50px); bottom: -45vh; width: 58.56vh; height: 130vh; background: transparent url('assets/qian-portrait-calm.png') center bottom / contain no-repeat; z-index: 0; pointer-events: none; }
    #portrait-worker { right: calc(7vw - 50px); bottom: -45vh; width: 58.56vh; height: 130vh; background: transparent url('assets/portrait-art-worker.png') center bottom / contain no-repeat; z-index: 0; pointer-events: none; }
    #portrait-crowd { left: 82%; bottom: -45vh; width: 86.7vh; height: 130vh; transform: translateX(-50%); background: transparent url('assets/portrait-crowd.png') center bottom / contain no-repeat; z-index: 0; pointer-events: none; }
    #portrait-farmer { left: 78%; bottom: -45vh; width: 58.56vh; height: 130vh; transform: translateX(-50%); background: transparent url('assets/portrait-farmer.png') center bottom / contain no-repeat; z-index: 0; opacity: 0; visibility: hidden; pointer-events: none; transition: left 1.6s cubic-bezier(.12,.72,.18,1), opacity 1.25s ease-out, filter .25s ease; }
    #portrait-farmer.farmer-visible { left: 50%; opacity: 1; visibility: visible; }
    #portrait-worker.group-entering, #portrait-crowd.group-entering { right: auto; transform: translateX(-50%); opacity: 0; visibility: hidden; transition: left 1.6s cubic-bezier(.12,.72,.18,1), opacity 1.25s ease-out, filter .25s ease; }
    #portrait-worker.group-entering { left: 78%; }
    #portrait-crowd.group-entering { left: 84%; }
    #portrait-worker.group-entering.group-visible { left: 48%; opacity: 1; visibility: visible; }
    #portrait-crowd.group-entering.group-visible { left: 66%; opacity: 1; visibility: visible; }
    .portrait-hidden { opacity: 0 !important; visibility: hidden !important; }
    #dialogue-box { position: absolute; inset: auto 0 0; z-index: 2; width: 100%; min-height: 28vh; padding: 5.5vh 8vw 4vh 29vw; background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.36) 18%, rgba(0,0,0,.78) 100%); color: #fff; }
    #speaker { position: absolute; left: 7vw; top: 5.3vh; width: 18vw; margin: 0; color: rgba(255,255,255,.65); font-size: clamp(1.25rem, 2.2vw, 2rem); font-weight: 400; text-align: right; letter-spacing: .08em; }
    #dialogue-text { margin: 0; min-height: 6rem; max-height: 19vh; overflow-y: auto; color: #fff; font-size: clamp(1rem, 1.7vw, 1.45rem); line-height: 1.75; letter-spacing: .035em; white-space: pre-line; text-shadow: 0 2px 5px rgba(0,0,0,.9); }
    #choices { position: fixed; left: 50%; top: 35%; z-index: 4; display: none; width: min(62vw, 920px); transform: translateX(-50%); flex-direction: column; gap: 3.5vh; }
    #choices button { position: relative; min-height: 72px; padding: 14px 4rem; border: 2px solid rgba(255,255,255,.72); background: rgba(20,20,22,.82); color: #fff; font: inherit; font-size: clamp(1rem, 1.7vw, 1.4rem); text-align: center; letter-spacing: .05em; cursor: pointer; box-shadow: inset 0 0 26px rgba(255,255,255,.035), 0 4px 18px rgba(0,0,0,.32); }
    #choices button::before, #choices button::after { content: ''; position: absolute; top: -3px; width: 28%; height: 4px; background: rgba(255,255,255,.9); }
    #choices button::before { left: -2px; }
    #choices button::after { right: -2px; }
    #choices button:hover { background: rgba(50,50,54,.9); }
    #choices button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #continue-button { display: none !important; }
    #fade { position: fixed; inset: 0; z-index: 12; background: #000; opacity: 0; pointer-events: none; }
    #fade.active { opacity: 1; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      #dialogue-box { min-height: 32vh; padding: 5vh 7vw 3vh 7vw; }
      #speaker { position: static; width: auto; margin-bottom: .6rem; text-align: left; }
      #dialogue-text { max-height: 22vh; }
      #choices { top: 27%; width: 84vw; gap: 2.5vh; }
      #choices button { min-height: 58px; padding: 10px 1.5rem; }
    }
  </style>
</head>
<body>
  <section id="start-screen" aria-label="游戏开始页面">
    <button id="start-button" type="button">开始游戏</button>
  </section>
  <button id="exit-button" type="button" aria-label="退出游戏流程" hidden>ESC</button>
  <canvas id="game" aria-label="2D 横版探索。使用 A、D 或左右方向键移动，空格、W 或上方向键跳跃，靠近发亮的窑洞门按 F 交互。" hidden></canvas>
  <section id="galgame" aria-label="剧情对话" hidden>
    <div id="portrait-left" class="portrait" aria-hidden="true"></div>
    <div id="portrait-farmer" class="portrait" aria-hidden="true"></div>
    <div id="portrait-worker" class="portrait portrait-hidden" aria-hidden="true"></div>
    <div id="portrait-crowd" class="portrait portrait-hidden" aria-hidden="true"></div>
    <div id="portrait-right" class="portrait" aria-hidden="true"></div>
    <div id="dialogue-box">
      <p id="speaker"></p>
      <p id="dialogue-text"></p>
      <div id="choices"></div>
      <button id="continue-button" type="button">继续</button>
    </div>
  </section>
  <div id="fade" aria-hidden="true"></div>
  <script src="assets/sprite-sheets.js?v=motion-fix-1"></script>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const startScreen = document.querySelector('#start-screen');
    const startButton = document.querySelector('#start-button');
    const exitButton = document.querySelector('#exit-button');
    const galgame = document.querySelector('#galgame');
    const portraitLeft = document.querySelector('#portrait-left');
    const portraitFarmer = document.querySelector('#portrait-farmer');
    const portraitWorker = document.querySelector('#portrait-worker');
    const portraitCrowd = document.querySelector('#portrait-crowd');
    const portraitRight = document.querySelector('#portrait-right');
    const speaker = document.querySelector('#speaker');
    const dialogueText = document.querySelector('#dialogue-text');
    const choices = document.querySelector('#choices');
    const continueButton = document.querySelector('#continue-button');
    const fade = document.querySelector('#fade');
    const bgmTracks = {
      1: new Audio('assets/bgm-1.m4a'),
      2: new Audio('assets/bgm-2.m4a'),
      3: new Audio('assets/bgm-3-loop.wav')
    };
    for (const track of Object.values(bgmTracks)) {
      track.loop = true;
      track.preload = 'auto';
      track.volume = 0.55;
    }
    let activeBgm = 0;
    const folkSong = new Audio('assets/huanghe-folk-song-trimmed.m4a');
    folkSong.preload = 'auto';
    folkSong.volume = 0.55;
    let folkSongLocked = false;
    let folkSongSecondPageIndex = -1;

    const introText = '1939年，延安鲁艺窑洞外，战火纷飞，华北沦陷，家国破碎。诗人光未然带回黄河血泪诗篇，一首即将震撼百年的民族灵魂回响，即将诞生。';
    const storyOpeningText = '1939年春节前夕，诗人光未然在延安文化界的联欢会上朗诵了一首自己刚刚创作的长诗《黄河吟》';
    const roleTexts = {
      xinghai: [
        storyOpeningText,
        '你非常激动，黄河大合唱的雏形在你心中已经明晰。顾不上其他，你给妻子简短交代之后就头也不回地奔向书房。你不知道接下来的创作会是什么样的，只知道它会是中华民族斗争中的强心剂。'
      ],
      qian: [
        storyOpeningText,
        '你注意到丈夫脸上抑制不住的兴奋，刚想开口问，他就转身来向你嘟囔了一句“这首诗写到我心坎里了”之类的，随后朝着书房的方向一路小跑。你微微一笑。',
        '“冼星海又这样。”',
        '你也走向书房。',
        '“可别激动得把桌子给啃了。”'
      ]
    };

    const qianPortraits = {
      calm: 'assets/qian-portrait-calm.png',
      happy: 'assets/qian-portrait-happy.png',
      determined: 'assets/qian-portrait-determined.png',
      worried: 'assets/qian-portrait-worried.png'
    };

    const xinghaiPortraits = {
      calm: 'assets/xinghai-portrait-calm.png',
      impassioned: 'assets/xinghai-portrait-impassioned.png',
      somber: 'assets/xinghai-portrait-somber.png'
    };

    const storyPaths = {
      xinghai: [
        {
          type: 'passage',
          speaker: '冼星海',
          background: 'night',
          portrait: 'calm',
          portraits: { xinghai: true },
          text: [
            '不知不觉屋外没了声响，原来天已经完全黑了。',
            '你伸了伸懒腰，转身吹灭蜡烛，上炕躺下。'
          ],
          nextWithoutPlatformer: true
        },
        {
          type: 'choice', speaker: '众人的质疑',
          portrait: 'somber',
          portraits: { xinghai: true, worker: true },
          prompt: [
            '一次午饭，你同在鲁艺工作的文艺工作者们蹲在窑洞门前，端着碗。',
            '你向他们分享了草稿，他们却觉得你谱的曲有些不妥。',
            '“冼星海，这曲风是不是有点太激昂了？”',
            '“对啊，我们文艺工作者应该写一些高雅柔和的曲子，你这曲子太吵了。”',
            '你呆了，动筷子的手也停了下来。',
            '没想到他们打了强心剂会是这样的反应。',
            '面对外界质疑“曲风太激昂，不宜公演”，你如何抉择？'
          ],
          options: [
            {
              label: 'A. 坚守本心，不改变曲风',
              portrait: 'impassioned',
              response: [
                '这让你不由得坚定了保持这样激昂旋律的想法。你双手按住谱纸：',
                '“同志们，国难当头啊！我们虽然身处后方，但别忘了在前线，我们的兄弟姐妹正经受着最严厉的炮火！”',
                '“文艺不是取悦太平的小调，而是唤醒国人的战鼓，只有更严厉的怒吼才能救中国于水火之中！怎么能改掉这样激昂的旋律呢？”',
                '听了你的一席话，羞愧的文艺工作者们幡然醒悟，纷纷点头表示赞成。',
                '你顶住所有争议，保留了来自于炎黄子孙的愤怒、悲壮、铿锵的原始力量。'
              ]
            },
            {
              label: 'B. 适当调整，适应当下',
              portrait: 'calm',
              response: [
                '你想反驳，但想到时间已经容不得你长篇大论了，于是作出选择性妥协，向他们承诺修改曲风。',
                '你回到书房后，确实修改了一定的激昂部分，不过只是删去了心中认为的过于单薄的“尖啸”，换成了更能体现厚重感的低音。实际上，来自中华民族的怒火没有减少一丝一毫。',
                '“不改风骨，只改节奏。”',
                '于是悲壮更加厚重，呐喊更加沉稳，既规避了争议，又保全了战斗内核。'
              ]
            }
          ]
        },
        {
          type: 'choice', speaker: '创作瓶颈',
          portrait: 'somber',
          portraits: { xinghai: true, qian: true },
          prompt: [
            '又到黄昏了。',
            '太累了，好几天伏在桌前，你的全身都在亮着红灯。眼睛肿胀无比，腰间隐隐作痛，脖子已经弯成一张弓了。',
            '妻子敏锐地感觉到了你的疲惫。她站到了书桌边，好一会儿，才开口问道：',
            '“你已经很久没有休息了。要不要出去走走？”',
            '你望向妻子，停下笔想了想。',
            '创作极限瓶颈，身心俱疲，《保卫黄河》高潮极难写，你要？'
          ],
          options: [
            {
              label: 'A. 硬抗绝境，透支身体写完高潮',
              portrait: 'impassioned',
              dayNightInterlude: true,
              response: [
                '“前线的同志们有没有休息时间？我还好，一点点疲惫，伸个懒腰就行。”说罢，你又抖擞精神，将对同胞的牵挂投入了创作。',
                '妻子知道劝不动你，也明白你在创作的是什么样的乐曲。',
                '她默默给你端了一杯咖啡，闻着有股黄豆的香味，又转身点上一支新蜡烛。',
                '你彻夜不眠，以血泪入曲，脑海奔涌黄河巨浪、军民抗争、山河破碎之景。',
                '哪怕双手发麻，双眼红肿，也要写出中华民族最不屈的怒吼。'
              ]
            },
            {
              label: 'B. 短暂休整，吸收民间号子再落笔',
              portrait: 'calm',
              response: [
                '沉默了一会。',
                { text: '“好吧，听你的。也许我这样一条路走到黑也不是个事。”你故作轻松，妻子也笑了：“这才对嘛，一直趴着对身体不好。走，我们去看看黄河。”', focus: ['xinghai', 'qian'], afterTravel: 'to-yellow-river' },
                '不见其影，却闻其声。你和妻子颠簸一路，还没到河边，已经听到了雷声般的响声。',
                '那不是雷声。',
                '是黄河的怒吼。',
                '“真厉害，这寒冬腊月的，不是汛期，也不是在壶口。黄河水声却还是震耳欲聋。”',
                '河水不断冲撞，携着泥沙，炸弹一般向岸边的石头倾泻无处安放的力量，激起漫天水雾。轰鸣声生生不息，声浪震得你身后崖壁上的酸枣树整日颤抖。浪花不断碎裂，重组，又一同向下游奔腾。',
                '你也被吓住了。',
                '这就是你要的力量！磅礴，持久，裹挟着怒火。',
                { text: '耳边隐隐传来高亢的人声，你的眼神沿岸边扫过，最终确定了声音的来源。', action: 'farmer-enter' },
                '那是一位身形精瘦的陕北老农，羊肚子手巾，粗布对襟短袄。',
                '嗓子里正吼出音量和他身形不匹配的信天游：',
                { text: '你晓得天下黄河几十几道湾哎？\n几十几道湾上有几十几只船哎？\n几十几只船上有几十几根杆哎？\n几十几个艄公哟嗬来把船儿搬？', action: 'folk-song-start' },
                '我晓得天下黄河九十九道湾哎！\n九十九道湾上有九十九只船哎！\n九十九只船上有九十九根杆哎！\n九十九个艄公哟嗬来把船儿搬。',
                '你又被吓住了。',
                '这就是你要的力量！磅礴，持久，裹挟着悲壮。',
                '你转头看向妻子，她就在你身边默默立着。感受到了你的目光，她也转过头来。',
                '“我知道怎么写了！咱们回去！”',
                '临走前，你又回头了。',
                '“我们的后辈也应该时常来这。”',
                { text: '你暂时停笔，聆听黄河船夫曲、陕北劳动号子，从人民土地里汲取力量，灵感破局，旋律更接地气，更雄浑磅礴。', afterTyped: 'resume-bgm-1' }
              ]
            }
          ]
        },
        {
          type: 'choice', speaker: '物资紧缺',
          portrait: 'somber',
          portraits: { xinghai: true, worker: true, crowd: true },
          deferGroupPortraits: true,
          prompt: [
            { text: '六天，初稿终于完成。你兴奋地走出书房，向同志们展示你的珍宝。', action: 'material-group-enter' },
            '手稿不断在众人手中传阅。',
            '许久，有人举手了：“是很好的曲子，但是是不是有些太复杂了？我们现在的条件根本没法演奏出来。”',
            '“俺看这洋码码啥也害不哈（看不懂），你们说好就好，但是俺只晓得俺们啥都没有。”',
            '你很高兴作品得到了认可。但确实存在很现实的问题：物资匮乏，没有太多资源供你使用，你必须做出抉择。',
            '物资紧缺，有人建议简化编曲，你？'
          ],
          options: [
            {
              label: 'A. 绝不简化，倾尽一切还原完整史诗编曲',
              portrait: 'impassioned',
              response: [
                '条件虽苦，信仰不苦！“同志们不用担心，我找些废纸来抄谱校对，就是把谱子写到衣服上也要留住它。”',
                '同志们纷纷对你点头，有些表示他们那里有不用的废纸，还有些人说可以帮你搜集纸张。',
                '困难还是存在的，但在众人的帮助下，也还是度过了难关。最终作品原样保留了下来。'
              ]
            },
            {
              label: 'B. 就地取材，因地制宜简化适配延安条件',
              portrait: 'calm',
              response: [
                '现实还是太残酷了。',
                '“好吧，我会根据现在的情况适当简化乐曲，但是其中要表达的情感我不会让步。”'
              ]
            }
          ]
        },
        { type: 'ending', speaker: '尾声', portrait: 'impassioned', portraits: { xinghai: true }, text: '你的坚持与打磨，让《黄河大合唱》在1943年春节慰问演出一炮而红！激昂歌声唱响边区、传遍全国。\n\n你以笔墨为犁、以旋律为种，歌颂奋斗、致敬平凡英雄，让自力更生、艰苦奋斗的延安精神，代代相传。' }
      ],
      qian: [
        {
          type: 'choice', speaker: '众人的质疑',
          portrait: 'calm',
          xinghaiPortrait: 'somber',
          portraits: { xinghai: true, worker: true },
          prompt: [
            '一天中午饭点，你看到丈夫和同事一起蹲着，手里端着碗却不动筷，明显气氛有些不对劲。向旁边人一打听才知道他们觉得丈夫新创作的曲子曲风太激进，不适合文人欣赏，劝他改一改。',
            '看丈夫的表情，他心里其实已经有了答案，只是还在犹豫。\n\n面对众人质疑“曲风太激进”，你如何帮丈夫解围？'
          ],
          options: [
            {
              label: 'A. 坚定站丈夫身后，公开捍卫创作初心',
              portrait: 'determined',

      activeBgm = number;
      nextTrack.currentTime = 0;
      nextTrack.play().catch(() => {});

    function drawPlayerSprite() {
      const { role, state, metadata, image } = selectSpriteFrame();
      if (!image.complete || !image.naturalWidth || !image.naturalHeight) return false;
      const spriteKey = `${role}:${state}`;
      if (activeSpriteKey !== spriteKey) {
        activeSpriteKey = spriteKey;
        activeSpriteStartedAt = performance.now();
      }
      const elapsedSeconds = (performance.now() - activeSpriteStartedAt) / 1000;
      const frameIndex = Math.floor(elapsedSeconds * metadata.fps) % metadata.frameCount;
      const bounds = metadata.bounds[frameIndex];
      const frameX = (frameIndex % metadata.columns) * metadata.frameWidth;
      const frameY = Math.floor(frameIndex / metadata.columns) * metadata.frameHeight;
      const sourceX = frameX + bounds.x;
      const sourceY = frameY + bounds.y;
      const calibration = spriteCalibration[role][state];
      const scale = Math.min(
        player.height / calibration.height,
        player.width * 1.1 / calibration.width
      );
      const drawWidth = bounds.width * scale;
      const drawHeight = bounds.height * scale;
      const drawX = player.x + (player.width - drawWidth) / 2;
      const drawY = player.y + player.height - drawHeight;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      if (playerFacing > 0) {
        ctx.translate(player.x * 2 + player.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(image, sourceX, sourceY, bounds.width, bounds.height, drawX, drawY, drawWidth, drawHeight);
      ctx.restore();
      return true;
    }

    }

    function startGame() {
      startScreen.hidden = true;
      exitButton.hidden = false;
      canvas.hidden = false;
      selectedRole = null;
      storyIndex = 0;
      currentPlayerLeftBoundary = playerLeftBoundary;
      showIntro();
    }

    function returnToStart(preserveTransition = false) {
      stopFolkSong();
      stopBgm();
      if (typingTimer) clearTimeout(typingTimer);
      if (travelStageTimer) clearTimeout(travelStageTimer);
      typingTimer = null;
      travelStageTimer = null;
      typingFinished = null;
      if (!preserveTransition) {
        if (transitionTimeout) clearTimeout(transitionTimeout);
        if (transitionResetTimeout) clearTimeout(transitionResetTimeout);
        transitionTimeout = null;
        transitionResetTimeout = null;
        transitionRunning = false;
        fade.classList.remove('active');
        fade.style.transition = '';
      }
      keys.clear();
      jumpQueued = false;
      interactionQueued = false;
      interactionActive = false;
      activeSpriteKey = '';
      activeSpriteStartedAt = performance.now();
      selectedRole = null;
      storyIndex = 0;
      dialogueStep = 'intro';
      dialoguePages = [];
      dialoguePageIndex = 0;
      dialoguePagesFinished = null;
      travelSequence = null;
      currentPlatformerScene = 'day';
      yananHiddenRouteActive = false;
      yananAchievementEarned = false;
      achievementToastUntil = 0;
      cocoaQuestActive = false;
      cocoaInteractionStartedAt = 0;
      cocoaToastUntil = 0;
      sceneTitleText = '';
      sceneTitleStartedAt = 0;
      sceneTitleUntil = 0;
      pendingDayNightInterlude = false;
      dayNightCycle = null;
      storyActorsFadeStartedAt = 0;
      setPortraitFocus(null);
      gameMode = 'start';
      galgame.hidden = true;
      canvas.hidden = true;
      exitButton.hidden = true;
      startScreen.hidden = false;
    }

    function exitToStart() {
      if (gameMode === 'start' || transitionRunning) return;
      transitionBetweenModes(() => returnToStart(true));
    }

    function showIntro() {
      dialogueStep = 'intro';
      setGalgameBackground('black');
      setXinghaiPortrait('calm');
      setQianPortrait('calm');
      applyPortraitSet({});
      prepareDialogue('前情提要');
      continueButton.textContent = '继续';
      typeDialogue(introText, () => { continueButton.hidden = false; });
    }

    function showRoleChoice() {
      dialogueStep = 'role-choice';
      setGalgameBackground('black');
      setXinghaiPortrait('calm');
      setQianPortrait('calm');
      applyPortraitSet({});
      prepareDialogue('身份选择');
      typeDialogue('选择你在这段故事中的身份。', () => {
        setChoices([
          { label: 'A. 冼星海', role: 'xinghai' },
          { label: 'B. 钱韵玲', role: 'qian' }
        ], item => {
          playBgm(1);
          transitionBetweenModes(() => showRoleSummary(item.role));
        });
      });
    }

    function showRoleSummary(role) {
      selectedRole = role;
      storyIndex = 0;
      setGalgameBackground('day');
      if (role === 'qian') {
        setQianPortrait('happy');
        applyPortraitSet({ qian: true });
      } else {
        setXinghaiPortrait('impassioned');
        applyPortraitSet({ xinghai: true });
      }
      prepareDialogue(role === 'xinghai' ? '冼星海' : '钱韵玲');
      if (Array.isArray(roleTexts[role])) {
        dialogueStep = 'role-summary-pages';
        startDialoguePages(roleTexts[role], () => {
          dialogueStep = 'role-summary';
        });
      } else {
        dialogueStep = 'role-summary';
        typeDialogue(roleTexts[role]);
      }
    }

    function showStoryNode() {
      const node = storyPaths[selectedRole][storyIndex];
      setGalgameBackground(node.background || (node.speaker === '创作瓶颈' ? 'day' : 'cave'));
      applyPortraitSet(node.deferGroupPortraits
        ? { ...node.portraits, worker: false, crowd: false }
        : node.portraits);
      if (selectedRole === 'qian') {
        setQianPortrait(node.portrait);
        setXinghaiPortrait(node.xinghaiPortrait);
      } else {
        setXinghaiPortrait(node.portrait);
      }
      prepareDialogue(node.speaker);
      if (node.type === 'choice') {
        if (Array.isArray(node.prompt)) {
          dialogueStep = 'story-choice-pages';
          startDialoguePages(node.prompt, () => {
            dialogueStep = 'story-choice';
            setChoices(node.options, showChoiceResult);
          });
        } else {
          dialogueStep = 'story-choice';
          typeDialogue(node.prompt, () => setChoices(node.options, showChoiceResult));
        }
      } else if (node.type === 'ending') {
        dialogueStep = 'ending';
        typeDialogue(node.text);
      } else {
        if (Array.isArray(node.text)) {
          dialogueStep = 'story-passage-pages';
          startDialoguePages(node.text, () => {
            dialogueStep = 'story-passage';
          });
        } else {
          dialogueStep = 'story-passage';
          typeDialogue(node.text);
        }
      }
    }

    function showChoiceResult(option) {
      choices.style.display = 'none';
      const node = storyPaths[selectedRole][storyIndex];
      pendingDayNightInterlude = Boolean(option.dayNightInterlude);
      if (selectedRole === 'qian' && option.cocoaQuest) {
        cocoaQuestActive = true;
        cocoaInteractionStartedAt = 0;
        cocoaToastUntil = 0;
      }
      applyPortraitSet(option.portraits || node.portraits, Boolean(node.deferGroupPortraits));
      if (selectedRole === 'qian') {
        setQianPortrait(option.portrait);
        setXinghaiPortrait(option.xinghaiPortrait);
      } else {
        setXinghaiPortrait(option.portrait);
      }
      if (Array.isArray(option.response)) {
        dialogueStep = 'story-result-pages';
        startDialoguePages(option.response, () => {
          dialogueStep = 'story-result';
        });
      } else {
        dialogueStep = 'story-result';
        typeDialogue(option.response);
      }
    }

    function enterPlatformer(resetPosition = false, scene = 'day', spawnOffsetX = 0) {
      gameMode = 'platformer';
      interactionActive = false;
      currentPlatformerScene = scene;
      galgame.hidden = true;
      canvas.hidden = false;
      keys.clear();
      jumpQueued = false;
      interactionQueued = false;
      storyActorsFadeStartedAt = 0;
      if (!travelSequence) {
        sceneTitleText = '';
        sceneTitleStartedAt = 0;
        sceneTitleUntil = 0;
      }
      if (resetPosition) {
        const defaultSpawnX = storyPoint.x + storyPoint.width / 2 - player.width / 2;
        player.x = defaultSpawnX + spawnOffsetX;
        currentPlayerLeftBoundary = spawnOffsetX < 0 ? Math.max(0, player.x) : playerLeftBoundary;
        player.y = sceneGroundY[currentPlatformerScene] - player.height;
        player.vx = 0;
        player.vy = 0;
        player.grounded = true;
        platformerSpawnX = player.x;
        platformerSpawnY = player.y;
        cameraX = 0;
      }
      lastTime = performance.now();
    }

    function startDayNightCycle() {
      keys.clear();
      jumpQueued = false;
      interactionQueued = false;
      player.vx = 0;
      player.vy = 0;
      dayNightCycle = {
        startedAt: performance.now() + 500,
        transitionDuration: 1500,
        scenes: ['day', 'night', 'day', 'night', 'day']
      };
    }

    function startStoryActorsFade(delay = 0) {
      storyActorsFadeStartedAt = performance.now() + delay;
    }

    function storyActorsOpacity(time) {
      if (!storyActorsFadeStartedAt) return 1;
      const progress = Math.max(0, Math.min(1, (time - storyActorsFadeStartedAt) / 1200));
      return progress * progress * (3 - 2 * progress);
    }

    function isMaterialPrelude() {
      return (
        (selectedRole === 'xinghai' && storyIndex === 3) ||
        (selectedRole === 'qian' && storyIndex === 2)
      );
    }

    function updateDayNightCycle(time) {
      if (!dayNightCycle) return false;
      const totalDuration = (dayNightCycle.scenes.length - 1) * dayNightCycle.transitionDuration;
      if (time - dayNightCycle.startedAt < totalDuration) return true;
      dayNightCycle = null;
      currentPlatformerScene = 'day';
      if (isMaterialPrelude()) startStoryActorsFade();
      return false;
    }

    function setTravelStage() {
      const stage = travelSequence.plan[travelSequence.stageIndex];
      yananHiddenRouteActive = false;
      if (stage.scene === 'yellowRiver') playBgm(3);
      if (stage.scene === 'auditorium') playBgm(2);
      enterPlatformer(true, stage.scene);
      if ((stage.scene === 'day' || stage.scene === 'yanan') && travelSequence.name === 'to-yellow-river') {
        sceneTitleText = '前往黄河边';
      } else if (stage.scene === 'yanan' && travelSequence.name === 'to-ending') {
        sceneTitleText = '前往陕北公学大礼堂进行首演';
      } else {
        sceneTitleText = sceneTitles[stage.scene] || '';
      }
      sceneTitleStartedAt = performance.now();
      sceneTitleUntil = sceneTitleText ? sceneTitleStartedAt + 3500 : 0;
      player.x = Number.isFinite(stage.x)
        ? stage.x
        : stage.start === 'default'
          ? storyPoint.x + storyPoint.width / 2 - player.width / 2
          : stage.start === 'right' ? playerRightBoundary : playerLeftBoundary;
      platformerSpawnX = player.x;
      platformerSpawnY = player.y;
      playerFacing = stage.direction < 0 ? -1 : 1;
      if (stage.hold) {
        travelStageTimer = setTimeout(() => {
          travelStageTimer = null;
          finishTravelStage();
        }, stage.hold);
      }
    }

    function startTravelSequence(name, onComplete) {
      const plan = travelPlans[name];
      if (!plan || transitionRunning) return;
      travelSequence = { name, plan, stageIndex: 0, onComplete };
      transitionBetweenModes(setTravelStage);
    }

    function finishTravelStage() {
      if (!travelSequence || transitionRunning) return;
      if (travelStageTimer) clearTimeout(travelStageTimer);
      travelStageTimer = null;
      transitionBetweenModes(() => {
        travelSequence.stageIndex += 1;
        if (travelSequence.stageIndex < travelSequence.plan.length) {
          setTravelStage();
          return;
        }
        const onComplete = travelSequence.onComplete;
        travelSequence = null;
        onComplete();
      });
    }

    function transitionBetweenModes(switchMode) {
      if (transitionRunning) return;
      transitionRunning = true;
      fade.style.transition = 'opacity 1s linear';
      fade.classList.add('active');
      transitionTimeout = setTimeout(() => {
        transitionTimeout = null;
        switchMode();
        fade.style.transition = 'opacity 0.5s linear';
        requestAnimationFrame(() => {
          fade.classList.remove('active');
        });
        transitionResetTimeout = setTimeout(() => {
          transitionResetTimeout = null;
          fade.style.transition = '';
          transitionRunning = false;
        }, 500);
      }, 1000);
    }

    function advanceStoryWithFade() {
      const currentNode = storyPaths[selectedRole][storyIndex];
      const nextNode = storyPaths[selectedRole][storyIndex + 1];
      if (currentNode.nextWithoutPlatformer) {
        transitionBetweenModes(() => {
          storyIndex += 1;
          showStoryNode();
        });
        return;
      }
      if (nextNode && nextNode.type === 'ending') {
        storyIndex += 1;
        startTravelSequence('to-ending', () => {
          canvas.hidden = true;
          galgame.hidden = false;
          showStoryNode();
        });
        return;
      }
      const spawnOffsetX = currentNode.speaker === '众人的质疑' ? branchOneSpawnOffsetX : 0;
      const runDayNightInterlude = pendingDayNightInterlude;
      pendingDayNightInterlude = false;
      transitionBetweenModes(() => {
        storyIndex += 1;
        enterPlatformer(true, 'day', spawnOffsetX);
        if (runDayNightInterlude) startDayNightCycle();
        else if (isMaterialPrelude()) startStoryActorsFade(500);
      });
    }

    function advanceGalgame() {
      if (transitionRunning) return;
      if (folkSongLocked) return;
      if (finishTypewriter()) return;
      if (dialogueStep.endsWith('-pages') && advanceDialoguePage()) return;
      if (dialogueStep === 'role-choice' || dialogueStep === 'story-choice' || dialogueStep === 'ending') return;
      if (dialogueStep === 'intro') showRoleChoice();
      else if (dialogueStep === 'role-summary') transitionBetweenModes(() => enterPlatformer(true, 'day', -500));
      else if (dialogueStep === 'story-passage' || dialogueStep === 'story-result') advanceStoryWithFade();
    }

    startButton.addEventListener('click', () => transitionBetweenModes(startGame));
    exitButton.addEventListener('click', exitToStart);

    galgame.addEventListener('click', event => {
      if (event.target.closest('button')) return;
      if (dialogueStep === 'ending' && !typingTimer) {
        exitToStart();
        return;
      }
      advanceGalgame();
    });

    addEventListener('keydown', event => {
      if (event.code === 'Escape' && gameMode !== 'start') {
        event.preventDefault();
        exitToStart();
        return;
      }
      if (gameMode === 'start') return;
      if (gameMode === 'galgame') {
        if (event.code === 'Space') event.preventDefault();
        if (!event.repeat) advanceGalgame();
        return;
      }

      if (controlKeys.has(event.code)) event.preventDefault();
      if (!keys.has(event.code) && ['ArrowUp', 'Space', 'KeyW'].includes(event.code)) jumpQueued = true;
      if (!keys.has(event.code) && event.code === 'KeyF') interactionQueued = true;
      keys.add(event.code);
    });

    addEventListener('keyup', event => keys.delete(event.code));
    addEventListener('blur', () => keys.clear());
    addEventListener('resize', resize);

    function resize() {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(innerWidth * ratio);
      canvas.height = Math.round(innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function overlaps(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function distanceTo(object) {
      return Math.abs((player.x + player.width / 2) - (object.x + object.width / 2));
    }

    function activePlatforms() {
      if (!travelSequence) return platforms;
      if (currentPlatformerScene === 'auditorium') return auditoriumPlatforms;
      const groundY = sceneGroundY[currentPlatformerScene];
      const ground = {
        x: playerLeftBoundary,
        y: groundY,
        width: playerRightBoundary - playerLeftBoundary + player.width,
        height: world.height - groundY
      };
      if (currentPlatformerScene === 'yanan' && yananHiddenRouteActive) {
        return [ground, ...yananHiddenPlatforms];
      }
      return [ground];
    }

    function movePlayer(dt) {
      if (gameMode !== 'platformer' || transitionRunning) return;
      const now = performance.now();
      if (updateDayNightCycle(now)) {
        player.vx = 0;
        jumpQueued = false;
        interactionQueued = false;
        return;
      }
      if (storyActorsFadeStartedAt && now < storyActorsFadeStartedAt + 1200) {
        player.vx = 0;
        jumpQueued = false;
        interactionQueued = false;
        return;
      }
      if (cocoaInteractionStartedAt) {
        player.vx = 0;
        jumpQueued = false;
        interactionQueued = false;
        if (now - cocoaInteractionStartedAt >= 3000) {
          cocoaInteractionStartedAt = 0;
          cocoaQuestActive = false;
          interactionActive = false;
          cocoaToastUntil = now + 3000;
        }
        return;
      }
      const left = keys.has('ArrowLeft') || keys.has('KeyA');
      const right = keys.has('ArrowRight') || keys.has('KeyD');
      const travelStage = travelSequence && travelSequence.plan[travelSequence.stageIndex];
      const stationaryTravelStage = Boolean(travelStage && travelStage.direction === 0);
      player.vx = stationaryTravelStage ? 0 : (right - left) * player.speed;
      if (player.vx < 0) playerFacing = -1;
      if (player.vx > 0) playerFacing = 1;
      if (jumpQueued && player.grounded && !stationaryTravelStage) {
        const playerCenter = player.x + player.width / 2;
        const hiddenRouteJump = Boolean(
          travelSequence &&
          currentPlatformerScene === 'yanan' &&
          playerCenter <= 620
        );
        if (hiddenRouteJump) yananHiddenRouteActive = true;
        player.vy = -player.jumpSpeed;
        player.grounded = false;
      }
      jumpQueued = false;

      const storyFinished = storyIndex >= storyPaths[selectedRole].length;
      if (
        !travelSequence &&
        interactionQueued &&
        cocoaQuestActive &&
        distanceTo(cocoaQuestPoint) < 120
      ) {
        interactionActive = true;
        player.vx = 0;
        keys.clear();
        cocoaInteractionStartedAt = now;
        cocoaToastUntil = 0;
      } else if (
        !travelSequence &&
        interactionQueued &&
        !cocoaQuestActive &&
        !storyFinished &&
        distanceTo(storyPoint) < 145
      ) {
        interactionActive = true;
        transitionBetweenModes(showStoryNode);
      }
      interactionQueued = false;

      const collisionPlatforms = activePlatforms();
      player.x += player.vx * dt;
      for (const platform of collisionPlatforms) {
        if (platform.oneWay) continue;
        if (!overlaps(player, platform)) continue;
        if (player.vx > 0) player.x = platform.x - player.width;
        if (player.vx < 0) player.x = platform.x + platform.width;
      }
      player.vy += 1700 * dt;
      const previousBottom = player.y + player.height;
      player.y += player.vy * dt;
      player.grounded = false;
      for (const platform of collisionPlatforms) {
        if (!overlaps(player, platform)) continue;
        if (platform.oneWay) {
          if (player.vy <= 0 || previousBottom > platform.y) continue;
          player.y = platform.y - player.height;
          player.vy = 0;
          player.grounded = true;
          continue;
        }
        if (player.vy > 0) {
          player.y = platform.y - player.height;
          player.vy = 0;
          player.grounded = true;
        } else if (player.vy < 0) {
          player.y = platform.y + platform.height;
          player.vy = 0;
        }
      }
      player.x = Math.max(currentPlayerLeftBoundary, Math.min(playerRightBoundary, player.x));
      if (
        currentPlatformerScene === 'yanan' &&
        yananHiddenRouteActive &&
        !yananAchievementEarned &&
        player.x + player.width / 2 >= 950 &&
        player.x + player.width / 2 <= 1080 &&
        player.y + player.height <= 420
      ) {
        yananAchievementEarned = true;
        achievementToastUntil = performance.now() + 3000;
      }
      if (travelSequence && !transitionRunning) {
        const stage = travelSequence.plan[travelSequence.stageIndex];
        if (
          (stage.direction < 0 && player.x <= playerLeftBoundary) ||
          (stage.direction > 0 && player.x >= playerRightBoundary)
        ) finishTravelStage();
      }
    }

    function drawYellowRiverMotion(background, time) {
      const downstream = 2.5 + Math.sin(time * .0032) * 2.5;
      const sideways = Math.sin(time * .0021) * 2;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(655, 260);
      ctx.lineTo(925, 260);
      ctx.lineTo(1435, world.height);
      ctx.lineTo(335, world.height);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = .32;
      ctx.drawImage(background, sideways, downstream, world.width, world.height);
      ctx.globalAlpha = .16;
      ctx.drawImage(background, -sideways, downstream * .45, world.width, world.height);
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 150);
      ctx.lineTo(700, 190);
      ctx.lineTo(730, 690);
      ctx.lineTo(360, 980);
      ctx.lineTo(0, 860);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = .3;
      ctx.drawImage(background, 0, downstream * 1.8, world.width, world.height);
      ctx.restore();
    }

    function drawAchievementToast(time) {
      if (time >= achievementToastUntil) return;
      const remaining = achievementToastUntil - time;
      const opacity = Math.min(1, (3000 - remaining) / 250, remaining / 400);
      const text = '隐藏成就：双手搂定宝塔山';
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.font = '30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText(text, world.width / 2, 103);
      ctx.restore();
    }

    function floatingTextOpacity(time) {
      const sceneOpacity = sceneTitleText && time < sceneTitleUntil
        ? Math.min(1, (time - sceneTitleStartedAt) / 400, (sceneTitleUntil - time) / 500)
        : 0;
      const achievementOpacity = time < achievementToastUntil
        ? Math.min(1, (time - (achievementToastUntil - 3000)) / 400, (achievementToastUntil - time) / 500)
        : 0;
      const cocoaOpacity = time < cocoaToastUntil
        ? Math.min(1, (time - (cocoaToastUntil - 3000)) / 400, (cocoaToastUntil - time) / 500)
        : 0;
      return Math.max(0, sceneOpacity, achievementOpacity, cocoaOpacity);
    }

    function drawFloatingTextBackdrop(time) {
      const opacity = floatingTextOpacity(time);
      if (opacity <= 0) return;
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height * .55);
      gradient.addColorStop(0, 'rgba(0, 0, 0, .56)');
      gradient.addColorStop(.65, 'rgba(0, 0, 0, .28)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height * .55);
      ctx.restore();
    }

    function drawSceneTitle(time) {
      if (!sceneTitleText || time >= sceneTitleUntil) return;
      const remaining = sceneTitleUntil - time;
      const opacity = Math.min(1, (time - sceneTitleStartedAt) / 250, remaining / 400);
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.font = '30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText(sceneTitleText, world.width / 2, 103);
      ctx.restore();
    }

    function drawStaticNpc(image, x, y) {
      if (!image.complete || !image.naturalWidth || !image.naturalHeight) return;
      const cropX = image.naturalWidth * .22;
      const cropY = image.naturalHeight * .045;
      const cropWidth = image.naturalWidth * .56;
      const cropHeight = image.naturalHeight * .92;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        image,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        x,
        y,
        player.width,
        player.height
      );
      ctx.restore();
    }

    function drawStoryNpcs() {
      if (selectedRole === 'xinghai' && travelSequence && currentPlatformerScene === 'yellowRiver') {
        drawStaticNpc(staticNpcSprites.farmer, platformerSpawnX + 1000, platformerSpawnY);
        return;
      }
      if (travelSequence) return;
      const branchOneSpawnX = storyPoint.x + storyPoint.width / 2 - player.width / 2 + branchOneSpawnOffsetX;
      const workerX = branchOneSpawnX + 50;
      const workerY = walkwayY - player.height + 50;
      if (selectedRole === 'xinghai') {
        if (storyIndex === 2) {
          drawStaticNpc(staticNpcSprites.artWorker, workerX, workerY);
        } else if (storyIndex === 3) {
          drawStaticNpc(staticNpcSprites.artWorker, workerX, workerY);
          drawStaticNpc(staticNpcSprites.crowd, workerX + 150, workerY);
        }
      } else if (selectedRole === 'qian') {
        if (storyIndex === 1) {
          drawStaticNpc(staticNpcSprites.artWorker, workerX, workerY);
        } else if (storyIndex === 2) {
          drawStaticNpc(staticNpcSprites.artWorker, workerX, workerY);
          drawStaticNpc(staticNpcSprites.crowd, workerX + 100, workerY);
        }
      }
    }

    function cocoaPlayerOpacity(time) {
      if (!cocoaInteractionStartedAt) return 1;
      const progress = Math.min(1, (time - cocoaInteractionStartedAt) / 3000);
      return Math.abs(1 - progress * 2);
    }

    function drawCocoaQuest(time) {
      if (cocoaQuestActive && !cocoaInteractionStartedAt) {
        const near = distanceTo(cocoaQuestPoint) < 120;
        const centerX = cocoaQuestPoint.x + cocoaQuestPoint.width / 2;
        ctx.save();
        ctx.fillStyle = '#fff4a8';
        ctx.shadowColor = '#fff29a';
        ctx.shadowBlur = 18;
        ctx.fillRect(centerX - 4, cocoaQuestPoint.y, 8, cocoaQuestPoint.height);
        ctx.beginPath();
        ctx.moveTo(centerX, cocoaQuestPoint.y - 15);
        ctx.lineTo(centerX + 10, cocoaQuestPoint.y);
        ctx.lineTo(centerX, cocoaQuestPoint.y + 15);
        ctx.lineTo(centerX - 10, cocoaQuestPoint.y);
        ctx.closePath();
        ctx.fill();
        if (near) {
          ctx.shadowColor = 'rgba(0, 0, 0, .9)';
          ctx.shadowBlur = 5;
          ctx.fillStyle = '#fff';
          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('按F交互', centerX, cocoaQuestPoint.y - 23);
        }
        ctx.restore();
      }
    }

    function drawCocoaToast(time) {
      if (time >= cocoaToastUntil) return;
      const remaining = cocoaToastUntil - time;
      const opacity = Math.min(1, (3000 - remaining) / 400, remaining / 500);
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = '#fff';
      ctx.font = '30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('获得可可替代物：黄豆', world.width / 2, 103);
      ctx.restore();
    }

    function draw() {
      if (gameMode !== 'platformer') return;
      const time = performance.now();
      const width = innerWidth;
      const height = innerHeight;
      ctx.fillStyle = selectedRole === 'qian' ? '#e4b58c' : '#87cbee';
      ctx.fillRect(0, 0, width, height);
      const background = platformerBackgrounds[currentPlatformerScene];
      const scaleToCover = Math.max(width / world.width, height / world.height);
      const offsetX = (width - world.width * scaleToCover) / 2;
      const offsetY = (height - world.height * scaleToCover) / 2;

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scaleToCover, scaleToCover);
      if (dayNightCycle) {
        const elapsed = Math.max(0, time - dayNightCycle.startedAt);
        const segment = Math.min(
          dayNightCycle.scenes.length - 2,
          Math.floor(elapsed / dayNightCycle.transitionDuration)
        );
        const rawProgress = Math.min(1, (elapsed % dayNightCycle.transitionDuration) / dayNightCycle.transitionDuration);
        const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);
        const fromBackground = platformerBackgrounds[dayNightCycle.scenes[segment]];
        const toBackground = platformerBackgrounds[dayNightCycle.scenes[segment + 1]];
        if (fromBackground.complete && fromBackground.naturalWidth) {
          ctx.drawImage(fromBackground, 0, 0, world.width, world.height);
        }
        if (toBackground.complete && toBackground.naturalWidth) {
          ctx.save();
          ctx.globalAlpha = progress;
          ctx.drawImage(toBackground, 0, 0, world.width, world.height);
          ctx.restore();
        }
      } else if (background.complete && background.naturalWidth) {
        ctx.drawImage(background, 0, 0, world.width, world.height);
        if (currentPlatformerScene === 'yellowRiver') {
          drawYellowRiverMotion(background, time);
        }
      }
      const storyFinished = selectedRole && storyIndex >= storyPaths[selectedRole].length;
      if (!dayNightCycle && !travelSequence && selectedRole && !storyFinished) {
        const interactionNear = !cocoaQuestActive && distanceTo(storyPoint) < 145;
        if (background.complete && background.naturalWidth) {
          ctx.save();
          if (interactionNear) {
            ctx.filter = 'brightness(1.65) saturate(1.2) drop-shadow(0 0 16px rgba(255, 241, 145, .95))';
          }
          ctx.drawImage(
            background,
            storyPoint.x,
            storyPoint.y,
            storyPoint.width,
            storyPoint.height,
            storyPoint.x,
            storyPoint.y,
            storyPoint.width,
            storyPoint.height
          );
          ctx.restore();
        }
        if (interactionNear) {
          ctx.fillStyle = '#fff';
          ctx.shadowColor = 'rgba(0, 0, 0, .9)';
          ctx.shadowBlur = 5;
          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('按F交互', storyPoint.x + storyPoint.width / 2, storyPoint.y - 10);
          ctx.shadowBlur = 0;
          ctx.textAlign = 'left';
        }
      }

      if (!dayNightCycle) {
        drawCocoaQuest(time);
        const actorsOpacity = storyActorsOpacity(time);
        ctx.save();
        ctx.globalAlpha = actorsOpacity * cocoaPlayerOpacity(time);
        if (!drawPlayerSprite()) {
          ctx.fillStyle = selectedRole === 'qian' ? '#d892b0' : '#e8c24d';
          ctx.fillRect(player.x, player.y, player.width, player.height);
        }
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = actorsOpacity;
        drawStoryNpcs();
        ctx.restore();
      }
      drawFloatingTextBackdrop(time);
      drawCocoaToast(time);
      drawSceneTitle(time);
      drawAchievementToast(time);
      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min((now - lastTime) / 1000, 1 / 30);
      lastTime = now;
      movePlayer(dt);
      draw();
      requestAnimationFrame(frame);
    }

    resize();
    returnToStart();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
