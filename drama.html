<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>红剧演绎·情景再现 - 延安十三年红色音乐高校美育平台</title>
<style>
:root{--red-main:#B22222;--red-deep:#8B1A1A;--gold:#E6B422;--gold-light:#F5D76E;--cream:#FBF0E0;--text:#3A1A1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;background:var(--cream);color:var(--text);line-height:1.9;}
header{background:var(--red-main);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:14px;}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--red-deep);font-weight:900;font-size:22px;}
.header-title{font-size:18px;font-weight:900;letter-spacing:2px;color:#fff;}
.header-nav a{color:#FFE8C8;text-decoration:none;margin-left:22px;font-size:14px;letter-spacing:2px;}
.header-nav a:hover{color:var(--gold-light);}
.page-banner{background:linear-gradient(135deg,var(--red-main),var(--red-deep));color:#fff;text-align:center;padding:70px 40px 60px;}
.page-banner h1{font-size:42px;letter-spacing:8px;font-weight:900;margin-bottom:16px;color:var(--gold-light);}
.page-banner .gold-line{width:140px;height:3px;background:var(--gold);margin:0 auto;}
.content{max-width:900px;margin:0 auto;padding:60px 40px;text-align:center;}
.detail-block{background:#fff;border-left:6px solid var(--red-main);padding:50px 34px;box-shadow:0 6px 20px rgba(139,26,26,.1);border-radius:0 4px 4px 0;}
.detail-block h3{color:var(--red-deep);font-size:24px;letter-spacing:4px;margin-bottom:16px;font-weight:800;}
.detail-block p{font-size:15px;color:#5A3A3A;letter-spacing:1px;line-height:1.9;}
.back-btn{display:inline-block;margin-top:30px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--red-deep);padding:12px 40px;letter-spacing:4px;font-weight:700;text-decoration:none;border-radius:2px;transition:.3s;}
.back-btn:hover{background:var(--red-deep);color:var(--gold-light);}
footer{background:#2A0A0A;color:#C9A9A9;text-align:center;padding:20px;font-size:13px;letter-spacing:2px;margin-top:40px;}
footer span{color:var(--gold);}
@media(max-width:768px){.page-banner h1{font-size:26px;letter-spacing:4px;}.header-title{font-size:14px;}.header-nav a{margin-left:12px;font-size:12px;}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">延</div>
    <div class="header-title">延安十三年红色音乐高校美育平台</div>
  </div>
  <nav class="header-nav"><a href=" ">首页</a ></nav>
</header>

<section class="page-banner">
  <h1>红剧演绎·情景再现</h1>
  <div class="gold-line"></div>
</section>

<section class="content">
  <div class="detail-block">
    <h3>板块建设中</h3>
    <p>红剧演绎·情景再现板块正在建设中，将陆续上线短剧视频，沉浸式演绎延安红色故事。</p >
    <a class="back-btn" href="index.html">返回首页</a >
  </div>
</section>

<footer>
  <p>陕西师范大学音乐学院 | 延安十三年红色音乐赋能高校思政美育调研项目</p >
  <p>延安十三年红色音乐高校美育平台 · <span>红色音乐赋能高校思政美育</span></p >
</footer>

</body>
</html>
